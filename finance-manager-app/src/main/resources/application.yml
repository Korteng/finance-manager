spring:
  application:
    name: finance-manager-app
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:15432/finance_db
    username: finance_user
    password: ${FINANCE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    ignore-migration-patterns: "*:pending"
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  sql:
    init:
      mode: never

logging:
  level:
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-insecure-default-secret-change-me-32chars-min}
    expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  application:
    name: ${spring.application.name}
    version: 0.0.1-SNAPSHOT

grpc:
  server:
    port: 9091
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/