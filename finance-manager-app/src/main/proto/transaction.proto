syntax = "proto3";

package ru.korteng.financemanager.grpc;

option java_multiple_files = true;
option java_package = "ru.korteng.finance_manager.grpc";
option java_outer_classname = "TransactionProto";

// Same business logic as GET /api/transactions/{id}, exposed as a unary gRPC call.
service TransactionGrpcService {
  rpc GetTransaction (GetTransactionRequest) returns (TransactionGrpcResponse);
}

message GetTransactionRequest {
  int64 id = 1;
  int64 user_id = 2;
}

message TransactionGrpcResponse {
  int64 id = 1;
  string amount = 2;      // BigDecimal as plain string - avoids float precision loss for money
  string currency = 3;
  string description = 4;
  string created_at = 5;  // ISO-8601 (Instant.toString())
  CategoryInfo category = 6;
}

message CategoryInfo {
  int64 id = 1;
  string name = 2;
  int64 parent_id = 3;
}
