apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-observer
  namespace: finance-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-observer
  template:
    metadata:
      labels:
        app: python-observer
    spec:
      containers:
        - name: python-observer
          image: korteng/python-observer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9100
          env:
            - name: TARGET_APP_URL
              value: "http://finance-app:8080"
            - name: TARGET_NOTIF_URL
              value: "http://notification-service:8081"
---
apiVersion: v1
kind: Service
metadata:
  name: python-observer
  namespace: finance-manager
spec:
  selector:
    app: python-observer
  ports:
    - port: 9100
      targetPort: 9100
